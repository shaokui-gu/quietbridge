# GitHub Release 构建：打 tag（v*）自动构建 macOS arm64 pkg 并发布
#
# 需要仓库 Settings → Secrets and variables → Actions 配置：
#   CERT_P12_BASE64  — Developer ID Application 证书 p12 的 base64
#   CERT_PASSWORD    — p12 导出密码
#
# 公证（暂未启用）：当前构建产出的 pkg 未签名（仅内部 app 用 Application 证书签名）。
#   要公证，需额外配置 APPLE_ID / APPLE_TEAM_ID / APPLE_APP_SPECIFIC_PASSWORD，
#   以及一个「Developer ID Installer」证书给 pkg 签名（与 Application 证书是两种证书）。

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.6.30；留空则用日期）'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26          # Apple Silicon (arm64)，macOS 26 SDK 与本机 Xcode 26 对齐
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version / build / tag
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            [ -n "$VERSION" ] || VERSION="$(date +%Y%m%d)"
            TAG="v${VERSION}"
          fi
          BUILD="$(date +%Y%m%d)"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}"     >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}  BUILD=${BUILD}  TAG=${TAG}"

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASSWORD:   ${{ secrets.CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning

      - name: Build Swift release executable
        run: |
          env CLANG_MODULE_CACHE_PATH="$RUNNER_TEMP/module-cache" \
              SWIFT_MODULECACHE_PATH="$RUNNER_TEMP/module-cache" \
              SWIFTPM_MODULECACHE_OVERRIDE="$RUNNER_TEMP/spm-cache" \
              swift build --package-path apps/macos --configuration release --disable-sandbox

      - name: Build authorization plugin
        run: make -C system/authorization-plugin all

      - name: Package installer
        env:
          COPYFILE_DISABLE: "1"
        run: |
          python3 packaging/macos/build.py \
            --version "${{ steps.meta.outputs.version }}" \
            --build   "${{ steps.meta.outputs.build }}" \
            --identity 'Developer ID Application: shaokui gu (62RNP54C47)'

      - name: Create GitHub Release & upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            dist/quietbridge-*.pkg \
            dist/quietbridge-*.pkg.sha256 \
            --generate-notes \
            --title "QuietBridge ${{ steps.meta.outputs.version }}"
